name: Deploy the walk page

# The phone side is a static site: it needs HTTPS for GPS, and nothing else.
# Planning (Gemma, routing) stays on your own computer.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cbaw/web build
        env:
          VITE_PUBLIC_WALK_URL: https://kengnidoriane.github.io/could-have-been-a-walk/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
